name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build the assets the views ask for
        run: |
          npm ci
          npm run build

      - run: ./vendor/bin/pest

  js:
    name: Build and JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Check the Lua plugins load
        run: node luacheck.mjs

  live-server:
    name: Live editing server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-editing-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: live-editing-server/package-lock.json

      - run: npm ci

      - run: npm test

  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      # The MCP tests run a real live server, so they need its dependencies too.
      - run: npm ci
        working-directory: live-editing-server

      - run: npm ci
        working-directory: mcp-server

      - run: npm test
        working-directory: mcp-server
